<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f" stop-opacity="1" />
      <stop offset="100%" stop-color="#020c1b" stop-opacity="1" />
    </radialGradient>
    
    <!-- Sphere Gradient (Cyan to Emerald to Violet) -->
    <linearGradient id="sphere-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glass-reflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Orbit Gradient -->
    <linearGradient id="orbit-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)" />

  <!-- Diagonal Light Glare -->
  <path d="M0,256 L512,0 L512,128 L0,384 Z" fill="#ffffff" opacity="0.03" />

  <g transform="translate(256, 256)">
    <!-- Back Orbit Ring -->
    <path d="M -160,0 A 160,60 0 1,1 160,0" fill="none" stroke="url(#orbit-grad)" stroke-width="8" stroke-dasharray="80 20" transform="rotate(-30)" opacity="0.5" />
    
    <!-- Main Glass Sphere -->
    <circle r="120" fill="url(#sphere-grad)" filter="url(#glow)" />
    
    <!-- Inner Glow/Shadow -->
    <circle r="120" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    <circle r="110" fill="none" stroke="#000000" stroke-width="4" opacity="0.3" />

    <!-- Glass Highlights -->
    <ellipse cx="0" cy="-60" rx="70" ry="30" fill="url(#glass-reflection)" transform="rotate(-15)" />
    <path d="M -80,40 Q 0,110 80,40 Q 0,80 -80,40" fill="#ffffff" opacity="0.3" />

    <!-- Front Orbit Ring -->
    <path d="M -170,0 A 170,70 0 0,0 170,0" fill="none" stroke="url(#orbit-grad)" stroke-width="12" stroke-linecap="round" transform="rotate(-30)" filter="url(#glow)" />
    
    <!-- Second Front Orbit Ring with Gap -->
    <path d="M -190,0 A 190,80 0 0,0 190,0" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="150 40 50 100" transform="rotate(15)" opacity="0.8" />

    <!-- Sparks (3 sparks with white core) -->
    <!-- Spark 1 -->
    <g transform="translate(-130, 40)">
      <circle r="8" fill="#00f2fe" filter="url(#glow)" />
      <circle r="3" fill="#ffffff" />
    </g>
    <!-- Spark 2 -->
    <g transform="translate(150, -50)">
      <circle r="12" fill="#8b5cf6" filter="url(#glow)" />
      <circle r="5" fill="#ffffff" />
    </g>
    <!-- Spark 3 -->
    <g transform="translate(40, 130)">
      <circle r="6" fill="#10b981" filter="url(#glow)" />
      <circle r="2" fill="#ffffff" />
    </g>
  </g>
</svg>
