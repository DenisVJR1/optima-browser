name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish application
        run: dotnet publish OptimaBrowser/OptimaBrowser.csproj --configuration Release --runtime win-x64 --self-contained false --output release/OptimaBrowser-win-x64

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path release/OptimaBrowser-win-x64/* -DestinationPath release/OptimaBrowser-${{ github.ref_name }}-win-x64.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} release/OptimaBrowser-${{ github.ref_name }}-win-x64.zip --title "Optima Browser ${{ github.ref_name }}" --generate-notes
